document.onreadystatechange = function () //https://docs.microsoft.com/en-us/dynamics365/customerengagement/on-premises/developer/sample-pass-multiple-values-web-resource-through-data-parameter
  {
  if (document.readyState == "complete")
    {
    getDataParam();
    document.getElementById("loading").style.display = "none";  // hide the loading gif
    }
  }

var startingDay = 0;
var maxDays = 31;

function getDataParam()
  {
  var vals = new Array();
  if (location.search != "")
    {
    vals = location.search.substr(1).split("&");
    for (var i in vals)
      {
      vals[i] = vals[i].replace(/\+/g, " ").split("=");
      }
    }

  var found = false
  for (var i in vals)
    {
    if (vals[i][0].toLowerCase() == "day")
      {
      found = true;
      break;
      }
    }

   if (!found)
    {
    if (document.location.href.includes("?"))
      document.location.href = window.location.href.replace(window.location.search,'') + "#day1";
    }
  else
    {
    startingDay = vals[0][1];
    if (startingDay >= document.getElementById("myTable").rows.length / 2)
      startingDay = (document.getElementById("myTable").rows.length / 2) - 1;
    }
  }

function hideDate()
  {
  var i = document.getElementById("myTable").rows.length / 2;
  while (i < maxDays)
   {
   document.getElementById(i).style.visibility="hidden";
   ++i;
   }
  }

function myInit()
  {
  url = document.location.href;
  if (document.location.href.includes("?"))
    {
    document.location.href = window.location.href.replace(window.location.search,'') + "#day" + ++startingDay;
    }

  hideDate();
  }

//*****************************************************************************************************************

// default index, if none is passed in, or if an invalid index is passed in, is 0.                                *
//*****************************************************************************************************************
